name: Android CI (Fast Build)

on:
  push:
    branches: [ "master", "dev" ]
  pull_request:
    branches: [ "master", "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build x86_64 Only
        run: |
          chmod +x gradlew
          # 构建 x86_64 版本用于模拟器测试
          ./gradlew :app:assembleDebug \
            -q \
            --no-daemon \
            --warning-mode=none \
            -Pandroid.split.perAbi=false \
            2>&1 | grep -v "^WARNING:" | grep -v "D8:" | grep -v "Unexpected error during rewriting of Kotlin metadata"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoJs6
          path: app/build/outputs/apk/debug/*.apk

      - name: Start Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: Nexus 6
          disk-size: 2000M
          emulator-boot-timeout: 900
          script: |
            # 查找 APK 文件 (universal 或 x86_64)
            APK=$(ls app/build/outputs/apk/debug/auto6-*-universal.apk 2>/dev/null || ls app/build/outputs/apk/debug/auto6-*-x86_64.apk 2>/dev/null || ls app/build/outputs/apk/debug/auto6-*.apk 2>/dev/null | head -1)
            echo "Installing APK: $APK"
            adb install "$APK"
            # 启动应用并监控 15 秒
            adb shell am start -n org.autojs.auto6/.MainActivity
            # 等待 15 秒并检查进程是否存活
            for i in {1..15}; do
              sleep 1
              if adb shell pidof org.autojs.auto6 > /dev/null 2>&1; then
                echo "App is running after $i seconds"
                exit 0
              fi
            done
            # 如果走到这里说明 app 已崩溃
            echo "App crashed or closed within 15 seconds"
            exit 1
