  # Gates the build: launches the APK on an emulator, warm-starts once to
  # prime ART/dex cache (so the second launch isn't dominated by 17s of
  # cold-start that drags system processes into ANR), then verifies that
  # MainActivity reaches the foreground with the "Flash Sale" (抢购) Tab
  # visible. Failure (Java crash, no process, or Tab missing) fails the
  # job — this is the gating check that protects the snipe feature.
  # Independent of test/instrumented-test/build so it never blocks them.
  startup-diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build x86_64 debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleAppDebug \
            -q \
            -Pandroid.injected.abi.list=x86_64 \
            --no-daemon \
            --warning-mode=none \
            2>&1 | grep -v "^WARNING:" | grep -v "D8:" | grep -v "Unexpected error during rewriting of Kotlin metadata"
          # Copy the built APK to a fixed name under the workspace so the
          # emulator script can reach it via $GITHUB_WORKSPACE (injected by
          # the runner, not subject to shell quoting/glob pitfalls).
          mkdir -p built-apk
          cp app/build/outputs/apk/app/debug/*-x86_64.apk built-apk/app-debug-x86_64.apk
          /usr/local/lib/android/sdk/build-tools/34.0.0/aapt dump badging built-apk/app-debug-x86_64.apk | grep -E 'package: name=|launchable-activity' || true

      - name: Build arm64-v8a debug APK (for real-device install)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleAppDebug \
            -q \
            -Pandroid.injected.abi.list=arm64-v8a \
            --no-daemon \
            --warning-mode=none \
            2>&1 | grep -v "^WARNING:" | grep -v "D8:" | grep -v "Unexpected error during rewriting of Kotlin metadata"
          cp app/build/outputs/apk/app/debug/*-arm64-v8a.apk built-apk/app-debug-arm64-v8a.apk
          /usr/local/lib/android/sdk/build-tools/34.0.0/aapt dump badging built-apk/app-debug-arm64-v8a.apk | grep -E 'package: name=|launchable-activity' || true

      - name: Launch app on emulator and capture crash stack
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_5
          # android-emulator-runner@v2 feeds `script` lines to `sh -c` line by
          # line, which breaks any multi-line if/then/fi structure. So the
          # emulator script is a single line that runs the whole logic under one
          # bash process via scripts/diagnose-startup.sh.
          script: bash "$GITHUB_WORKSPACE/scripts/diagnose-startup.sh"

      - name: Upload emulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-diagnosis-logs
          path: |
            ${{ github.workspace }}/full-logcat.txt
            ${{ github.workspace }}/crash.log
            ${{ github.workspace }}/init-log.txt
            ${{ github.workspace }}/ui_dump.xml
            ${{ github.workspace }}/screenshot.png
            ${{ github.workspace }}/built-apk/app-debug-x86_64.apk
            ${{ github.workspace }}/built-apk/app-debug-arm64-v8a.apk
          if-no-files-found: warn

