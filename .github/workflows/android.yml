name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Run unit tests
        run: ./gradlew :app:testAppDebugUnitTest

  instrumented-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: Nexus 6
          script: ./gradlew :app:connectedAppDebugAndroidTest

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [test, instrumented-test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build Arm64 Only
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleAppDebug \
            -q \
            -Pandroid.injected.abi.list=arm64-v8a \
            --no-daemon \
            --warning-mode=none \
            2>&1 | grep -v "^WARNING:" | grep -v "D8:" | grep -v "Unexpected error during rewriting of Kotlin metadata"

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoJs6-arm64-v8a
          path: app/build/outputs/apk/app/debug/*-arm64-v8a.apk

      - name: Build x86_64 APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleAppDebug \
            -q \
            -Pandroid.injected.abi.list=x86_64 \
            --no-daemon \
            --warning-mode=none \
            2>&1 | grep -v "^WARNING:" | grep -v "D8:" | grep -v "Unexpected error during rewriting of Kotlin metadata"
          cp app/build/outputs/apk/app/debug/*-x86_64.apk app/build/outputs/apk/app/debug/simple-process-x86_64.apk

      - name: Check APK Info
        run: |
          echo "=== Checking APK package info ==="
          /usr/local/lib/android/sdk/build-tools/34.0.0/aapt dump badging app/build/outputs/apk/app/debug/simple-process-x86_64.apk | tee /tmp/apk_info.txt
          echo ""
          echo "=== APK Summary ==="
          grep "package: name=" /tmp/apk_info.txt
          grep "launchable-activity" /tmp/apk_info.txt || echo "launchable-activity: Not found"

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoJs6-x86_64
          path: app/build/outputs/apk/app/debug/simple-process-x86_64.apk

  # Diagnoses app startup crashes by launching the APK on an emulator and
  # dumping `adb logcat` so the FATAL EXCEPTION stack trace lands in the
  # workflow log. Independent of test/instrumented-test/build so it never
  # blocks them; continue-on-error keeps the run green even if the app
  # crashes (the whole point is to capture that crash).
  startup-diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build x86_64 debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleAppDebug \
            -q \
            -Pandroid.injected.abi.list=x86_64 \
            --no-daemon \
            --warning-mode=none \
            2>&1 | grep -v "^WARNING:" | grep -v "D8:" | grep -v "Unexpected error during rewriting of Kotlin metadata"

      - name: Resolve APK path
        id: apk
        run: echo "path=$(ls app/build/outputs/apk/app/debug/*-x86_64.apk | head -1)" >> "$GITHUB_OUTPUT"

      - name: Launch app on emulator and capture crash stack
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_5
          script: |
            set +e
            APK="${{ steps.apk.outputs.path }}"
            echo "::group::Install APK"
            adb install -r "$APK"
            echo "::endgroup::"

            echo "::group::Clear logcat"
            adb logcat -c
            echo "::endgroup::"

            echo "::group::Launch app (com.simple.process)"
            adb shell am start -n com.simple.process/org.autojs.autojs.ui.splash.SplashActivity \
              -a android.intent.action.MAIN -c android.intent.category.LAUNCHER
            echo "::endgroup::"

            echo "Waiting 10s for app to pass splash into MainActivity..."
            sleep 10

            echo "::group::Process alive check"
            PID="$(adb shell pidof com.simple.process | tr -d '\r')"
            echo "pidof com.simple.process => [${PID}]"
            if [ -n "$PID" ]; then
              echo "::notice::App process is ALIVE (no startup crash)"
            else
              echo "::warning::App process is GONE (startup crash suspected)"
            fi
            echo "::endgroup::"

            # Capture the crash stack BEFORE the process may be auto-restarted.
            echo "::group::logcat (full, with timestamps)"
            adb logcat -d -v time
            echo "::endgroup::"

            echo "::group::logcat ERROR+FATAL (the crash stack)"
            adb logcat -d *:E AndroidRuntime:E | grep -iE "AndroidRuntime|FATAL|Exception|Caused by|at org.autojs|at com.simple" || echo "(no AndroidRuntime FATAL lines found)"
            echo "::endgroup::"

            # Save logs for artifact upload.
            adb logcat -d -v time > full-logcat.txt
            adb logcat -d *:E AndroidRuntime:E > crash.log

      - name: Upload emulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-diagnosis-logs
          path: |
            full-logcat.txt
            crash.log
          if-no-files-found: warn

