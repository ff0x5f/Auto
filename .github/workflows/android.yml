name: Android CI (Fast Build)

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build Arm64 Only
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleAppDebug \
            -q \
            -Pandroid.injected.abi.list=arm64-v8a \
            --no-daemon \
            --warning-mode=none \
            2>&1 | grep -v "^WARNING:" | grep -v "D8:" | grep -v "Unexpected error during rewriting of Kotlin metadata"

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoJs6-arm64-v8a
          path: app/build/outputs/apk/app/debug/*-arm64-v8a.apk

      - name: Build x86_64 for Emulator Test
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleAppDebug \
            -q \
            -Pandroid.injected.abi.list=x86_64 \
            --no-daemon \
            --warning-mode=none \
            2>&1 | grep -v "^WARNING:" | grep -v "D8:" | grep -v "Unexpected error during rewriting of Kotlin metadata"
          cp app/build/outputs/apk/app/debug/*-x86_64.apk app/build/outputs/apk/app/debug/simple-process-x86_64.apk

      - name: Check APK Launch Activity
        run: |
          echo "=== Checking APK package info ==="
          /usr/local/lib/android/sdk/build-tools/34.0.0/aapt dump badging app/build/outputs/apk/app/debug/simple-process-x86_64.apk | tee /tmp/apk_info.txt
          echo "=== Full launchable activity line ==="
          grep "launchable-activity" /tmp/apk_info.txt || echo "No launchable-activity found"

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoJs6-x86_64
          path: app/build/outputs/apk/app/debug/simple-process-x86_64.apk

  emulator-test:
    needs: build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download x86_64 APK
        uses: actions/download-artifact@v4
        with:
          name: AutoJs6-x86_64
          path: app/build/outputs/apk/app/debug/

      - name: Test APK on Emulator
        run: |
          echo "=== Starting Emulator ==="
          # Create AVD
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "system-images;android-34;default;x86_64" > /dev/null 2>&1
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager create avd -n test -k "system-images;android-34;default;x86_64" --force > /dev/null 2>&1

          # Start emulator in background
          $ANDROID_HOME/emulator/emulator -avd test -no-window -no-snapshot -no-audio -no-boot-anim &
          EMULATOR_PID=$!

          echo "=== Waiting for Emulator to Boot ==="
          until ($ANDROID_HOME/platform-tools/adb shell getprop sys.boot_completed 2>/dev/null | grep -q "1"); do
            echo "Waiting for boot..."
            sleep 5
          done
          echo "Emulator booted!"

          echo "=== Disabling Animations ==="
          $ANDROID_HOME/platform-tools/adb shell settings put global window_animation_scale 0.0
          $ANDROID_HOME/platform-tools/adb shell settings put global transition_animation_scale 0.0
          $ANDROID_HOME/platform-tools/adb shell settings put global animator_duration_scale 0.0

          echo "=== Cleaning Environment ==="
          $ANDROID_HOME/platform-tools/adb logcat -c
          $ANDROID_HOME/platform-tools/adb shell rm /sdcard/view.xml 2>/dev/null || true

          echo "=== Installing APK ==="
          $ANDROID_HOME/platform-tools/adb install -r app/build/outputs/apk/app/debug/simple-process-x86_64.apk

          echo "=== Starting app ==="
          $ANDROID_HOME/platform-tools/adb shell am start -n com.simple.process/.MainActivity

          echo "=== Verification Loop (60s) ==="
          n=0
          while [ $n -lt 60 ]; do
            sleep 2
            n=$((n + 2))
            echo "--- Check at ${n}s ---"

            # 1. Process Check
            if ! $ANDROID_HOME/platform-tools/adb shell pidof com.simple.process > /dev/null; then
              echo "Process not found"
            fi

            # 2. Crash Check
            if $ANDROID_HOME/platform-tools/adb logcat -d | grep -iE "FATAL|NativeCrash|has stopped|ANR" | grep -q "com.simple.process"; then
              echo "CRASH DETECTED!"
              $ANDROID_HOME/platform-tools/adb logcat -d | grep -iE "FATAL|Exception" | tail -20
              kill $EMULATOR_PID 2>/dev/null || true
              exit 1
            fi

            # 3. UI Content Check
            $ANDROID_HOME/platform-tools/adb shell uiautomator dump /sdcard/view.xml > /dev/null
            $ANDROID_HOME/platform-tools/adb pull /sdcard/view.xml /tmp/view.xml 2>/dev/null || true

            if [ -s /tmp/view.xml ]; then
              if grep -qiE "drawer_layout|viewpager|tab_layout|explorer|plugin|task_manager|snipe" /tmp/view.xml; then
                echo "SUCCESS: App main UI detected."
                kill $EMULATOR_PID 2>/dev/null || true
                exit 0
              fi
              if grep -qiE "文件|文档|插件|任务|sample|explorer" /tmp/view.xml; then
                echo "SUCCESS: App content detected."
                kill $EMULATOR_PID 2>/dev/null || true
                exit 0
              fi
            fi
          done

          echo "Timeout: UI elements not found within 60s."
          kill $EMULATOR_PID 2>/dev/null || true
          exit 1
