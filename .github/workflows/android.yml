name: Android CI (Fast Build)

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build Arm64 Only
        run: |
          chmod +x gradlew
          # 使用 Debug 构建以获得自动签名，可直接安装
          ./gradlew :app:assembleAppDebug \
            -q \
            -Pandroid.injected.abi.list=arm64-v8a \
            --no-daemon \
            --warning-mode=none \
            2>&1 | grep -v "^WARNING:" | grep -v "D8:" | grep -v "Unexpected error during rewriting of Kotlin metadata"

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoJs6-arm64-v8a
          path: app/build/outputs/apk/app/debug/*-arm64-v8a.apk

      - name: Build x86_64 for Emulator Test
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleAppDebug \
            -q \
            -Pandroid.injected.abi.list=x86_64 \
            --no-daemon \
            --warning-mode=none \
            2>&1 | grep -v "^WARNING:" | grep -v "D8:" | grep -v "Unexpected error during rewriting of Kotlin metadata"
          cp app/build/outputs/apk/app/debug/*-x86_64.apk app/build/outputs/apk/app/debug/autojs6-x86_64.apk

      - name: Check APK Launch Activity
        run: |
          echo "=== Checking APK package info ==="
          /usr/local/lib/android/sdk/build-tools/34.0.0/aapt dump badging app/build/outputs/apk/app/debug/autojs6-x86_64.apk | tee /tmp/apk_info.txt
          echo "=== Full launchable activity line ==="
          grep "launchable-activity" /tmp/apk_info.txt || echo "No launchable-activity found"

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoJs6-x86_64
          path: app/build/outputs/apk/app/debug/autojs6-x86_64.apk

      - name: Test APK on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: Nexus 6
          disk-size: 2000M
          emulator-boot-timeout: 900
          script: |
            echo "=== Installing APK ==="
            adb install app/build/outputs/apk/app/debug/autojs6-x86_64.apk
            echo "=== Starting app with monkey ==="
            adb shell monkey -p org.autojs.autojs6 -c android.intent.category.LAUNCHER 1 2>&1 || echo "monkey done"
            echo "=== Checking foreground for 30s ==="
            # 如果 10 秒内应用没出现在前台，判定为闪退失败
            n=0; found=0
            while [ $n -lt 30 ]; do sleep 1; n=$(expr $n + 1)
              if adb shell dumpsys window windows | grep -E "mCurrentFocus|mFocusedApp" | grep -q "org.autojs.autojs6"; then
                echo "App in foreground at ${n}s"
                found=1
              else
                echo "No foreground at ${n}s"
              fi
            done
            if [ $found -eq 0 ]; then
              echo "FAIL: App never appeared in foreground (crashed)"
              exit 1
            fi
            echo "App appeared in foreground - test passed"
            exit 0
