name: Android CI (Fast Build)

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build Arm64 Only
        run: |
          chmod +x gradlew
          # 使用 Debug 构建以获得自动签名，可直接安装
          ./gradlew :app:assembleAppDebug \
            -q \
            -Pandroid.injected.abi.list=arm64-v8a \
            --no-daemon \
            --warning-mode=none \
            2>&1 | grep -v "^WARNING:" | grep -v "D8:" | grep -v "Unexpected error during rewriting of Kotlin metadata"

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoJs6-arm64-v8a
          path: app/build/outputs/apk/app/debug/*-arm64-v8a.apk

      - name: Build x86_64 for Emulator Test
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleAppDebug \
            -q \
            -Pandroid.injected.abi.list=x86_64 \
            --no-daemon \
            --warning-mode=none \
            2>&1 | grep -v "^WARNING:" | grep -v "D8:" | grep -v "Unexpected error during rewriting of Kotlin metadata"
          cp app/build/outputs/apk/app/debug/*-x86_64.apk app/build/outputs/apk/app/debug/simple-process-x86_64.apk

      - name: Check APK Launch Activity
        run: |
          echo "=== Checking APK package info ==="
          /usr/local/lib/android/sdk/build-tools/34.0.0/aapt dump badging app/build/outputs/apk/app/debug/simple-process-x86_64.apk | tee /tmp/apk_info.txt
          echo "=== Full launchable activity line ==="
          grep "launchable-activity" /tmp/apk_info.txt || echo "No launchable-activity found"

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoJs6-x86_64
          path: app/build/outputs/apk/app/debug/simple-process-x86_64.apk

      - name: Start Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: Nexus 6
          disk-size: 2000M
          emulator-boot-timeout: 900

      - name: Test APK on Emulator
        run: |
          echo "=== Cleaning Environment ==="
          adb logcat -c
          adb shell rm /sdcard/view.xml 2>/dev/null || true

          echo "=== Installing APK ==="
          adb install -r app/build/outputs/apk/app/debug/simple-process-x86_64.apk

          echo "=== Starting app ==="
          adb shell monkey -p com.simple.process -c android.intent.category.LAUNCHER 1

          echo "=== Verification Loop (60s) ==="
          n=0
          while [ $n -lt 60 ]; do
            sleep 2
            n=$((n + 2))
            echo "--- Check at ${n}s ---"

            # 1. Process Check
            if ! adb shell pidof com.simple.process > /dev/null; then
              echo "Process not found"
            fi

            # 2. Crash Check
            if adb logcat -d | grep -iE "FATAL|NativeCrash|has stopped|ANR|Process.*crashed" | grep -q "com.simple.process"; then
              echo "CRASH DETECTED!"
              adb logcat -d | grep -iE "FATAL|Exception|AndroidRuntime" | grep -q "com.simple.process" && echo "=== Crash Details ===" && adb logcat -d | grep -iE "FATAL|Exception" | tail -20
              exit 1
            fi

            # 3. UI Content Check
            adb shell uiautomator dump /sdcard/view.xml > /dev/null
            adb pull /sdcard/view.xml /tmp/view.xml 2>/dev/null || true

            if [ -s /tmp/view.xml ]; then
              if grep -qiE "drawer_layout|viewpager|tab_layout|explorer|plugin|task_manager|snipe" /tmp/view.xml; then
                echo "SUCCESS: App main UI detected."
                exit 0
              fi
              if grep -qiE "文件|文档|插件|任务|sample|explorer" /tmp/view.xml; then
                echo "SUCCESS: App content detected."
                exit 0
              fi
            fi
          done

          echo "Timeout: UI elements not found within 60s."
          exit 1
