name: Android CI (Fast Build)

on:
  push:
    branches: [ "master", "dev" ]
  pull_request:
    branches: [ "master", "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug \
            -q \
            --no-daemon \
            --warning-mode=none \
            2>&1 | grep -v "^WARNING:" | grep -v "D8:" | grep -v "Unexpected error during rewriting of Kotlin metadata"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoJs6
          path: app/build/outputs/apk/debug/*.apk

      - name: Test APK on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: Nexus 6
          disk-size: 2000M
          emulator-boot-timeout: 900
          script: |
            adb install app/build/outputs/apk/debug/auto6-v6.2.0-x86_64.apk
            adb shell monkey -p org.autojs.auto6 -c android.intent.category.LAUNCHER 1
            sleep 3
            n=0; while [ $n -lt 15 ]; do sleep 1; n=$(expr $n + 1); if adb shell pidof org.autojs.auto6 > /dev/null 2>&1; then if adb shell dumpsys window windows | grep -E "mCurrentFocus" | grep -q "org.autojs.auto6"; then echo "App running at ${n}s (foreground)"; else echo "App in background at ${n}s"; fi; else echo "App crashed (process not found)"; exit 1; fi; done; echo "App stable for 15s"; exit 0
