name: Android CI (Fast Build)

on:
  push:
    branches: [ "master", "dev" ]
  pull_request:
    branches: [ "master", "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build Arm64 Only
        run: |
          chmod +x gradlew
          # 使用 Debug 构建以获得自动签名，可直接安装
          ./gradlew :app:assembleDebug \
            -q \
            --no-daemon \
            --warning-mode=none \
            2>&1 | grep -v "^WARNING:" | grep -v "D8:" | grep -v "Unexpected error during rewriting of Kotlin metadata"

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoJs6-arm64-v8a
          path: app/build/outputs/apk/debug/*-arm64-v8a.apk

      - name: Start Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: arm64-v8a
          profile: Nexus 6
          disk-size: 2000M
          script: |
            # 安装 APK
            adb install app/build/outputs/apk/debug/*-arm64-v8a.apk
            # 启动应用并监控 15 秒
            adb shell am start -n org.autojs.auto6/.MainActivity
            # 等待 15 秒并检查进程是否存活
            for i in {1..15}; do
              sleep 1
              if adb shell pidof org.autojs.auto6 > /dev/null 2>&1; then
                echo "App is running after $i seconds"
                exit 0
              fi
            done
            # 如果走到这里说明 app 已崩溃
            echo "App crashed or closed within 15 seconds"
            exit 1
