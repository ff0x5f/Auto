name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

  instrumented-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: Nexus 6
          script: ./gradlew :app:connectedDebugAndroidTest

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [test, instrumented-test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build Arm64 Only
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleAppDebug \
            -q \
            -Pandroid.injected.abi.list=arm64-v8a \
            --no-daemon \
            --warning-mode=none \
            2>&1 | grep -v "^WARNING:" | grep -v "D8:" | grep -v "Unexpected error during rewriting of Kotlin metadata"

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoJs6-arm64-v8a
          path: app/build/outputs/apk/app/debug/*-arm64-v8a.apk

      - name: Build x86_64 APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleAppDebug \
            -q \
            -Pandroid.injected.abi.list=x86_64 \
            --no-daemon \
            --warning-mode=none \
            2>&1 | grep -v "^WARNING:" | grep -v "D8:" | grep -v "Unexpected error during rewriting of Kotlin metadata"
          cp app/build/outputs/apk/app/debug/*-x86_64.apk app/build/outputs/apk/app/debug/simple-process-x86_64.apk

      - name: Check APK Info
        run: |
          echo "=== Checking APK package info ==="
          /usr/local/lib/android/sdk/build-tools/34.0.0/aapt dump badging app/build/outputs/apk/app/debug/simple-process-x86_64.apk | tee /tmp/apk_info.txt
          echo ""
          echo "=== APK Summary ==="
          grep "package: name=" /tmp/apk_info.txt
          grep "launchable-activity" /tmp/apk_info.txt || echo "launchable-activity: Not found"

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoJs6-x86_64
          path: app/build/outputs/apk/app/debug/simple-process-x86_64.apk
