  # Diagnoses app startup crashes by launching the APK on an emulator and
  # dumping `adb logcat` so the FATAL EXCEPTION stack trace lands in the
  # workflow log. Independent of test/instrumented-test/build so it never
  # blocks them; continue-on-error keeps the run green even if the app
  # crashes (the whole point is to capture that crash).
  startup-diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build x86_64 debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleAppDebug \
            -q \
            -Pandroid.injected.abi.list=x86_64 \
            --no-daemon \
            --warning-mode=none \
            2>&1 | grep -v "^WARNING:" | grep -v "D8:" | grep -v "Unexpected error during rewriting of Kotlin metadata"
          # Copy the built APK to a stable absolute path so the emulator script
          # (which runs in a different cwd) can find it without globbing.
          SRC="$(ls app/build/outputs/apk/app/debug/*-x86_64.apk | head -1)"
          cp "$SRC" /tmp/app-debug-x86_64.apk
          echo "Installed APK to $(/usr/local/lib/android/sdk/build-tools/34.0.0/aapt dump badging /tmp/app-debug-x86_64.apk 2>/dev/null | grep -E 'package: name=|launchable-activity')" || true

      - name: Launch app on emulator and capture crash stack
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_5
          script: |
            set +e
            # /tmp is shared across the job, so the absolute path built in the
            # previous step is reachable regardless of the emulator script cwd.
            APK=/tmp/app-debug-x86_64.apk
            echo "Resolved APK => [$APK] ($(ls -l "$APK" 2>/dev/null || echo MISSING))"
            if [ ! -f "$APK" ]; then
              echo "::error::APK not found at $APK"
              exit 0
            fi

            echo "::group::Install APK"
            adb install -r "$APK"
            INSTALL_RC=$?
            echo "adb install rc=$INSTALL_RC"
            echo "::endgroup::"
            # Continue even if install failed, to still capture logcat context.

            echo "::group::Clear logcat"
            adb logcat -c
            echo "::endgroup::"

            echo "::group::Launch app (com.simple.process)"
            adb shell am start -n com.simple.process/org.autojs.autojs.ui.splash.SplashActivity \
              -a android.intent.action.MAIN -c android.intent.category.LAUNCHER
            echo "::endgroup::"

            echo "Waiting 12s for app to pass splash (1s) into MainActivity..."
            sleep 12

            echo "::group::Process alive check"
            PID="$(adb shell pidof com.simple.process | tr -d '\r')"
            echo "pidof com.simple.process => [${PID}]"
            if [ -n "$PID" ]; then
              echo "::notice::App process is ALIVE (no startup crash)"
            else
              echo "::warning::App process is GONE (startup crash suspected)"
            fi
            echo "::endgroup::"

            # Capture the crash stack BEFORE the process may be auto-restarted.
            echo "::group::logcat (full, with timestamps)"
            adb logcat -d -v time
            echo "::endgroup::"

            echo "::group::logcat ERROR+FATAL (the crash stack)"
            adb logcat -d *:E AndroidRuntime:E | grep -iE "AndroidRuntime|FATAL|Exception|Caused by|at org.autojs|at com.simple" || echo "(no AndroidRuntime FATAL lines found)"
            echo "::endgroup::"

            # Save logs for artifact upload (absolute path: emulator script cwd
            # differs from the artifact step's cwd).
            adb logcat -d -v time > /tmp/full-logcat.txt
            adb logcat -d *:E AndroidRuntime:E > /tmp/crash.log

      - name: Upload emulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-diagnosis-logs
          path: |
            /tmp/full-logcat.txt
            /tmp/crash.log
          if-no-files-found: warn

